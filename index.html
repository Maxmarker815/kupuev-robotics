   РЕНДЕР
   ===================================================================== */
/* Короткое сообщение внизу экрана: подтверждает, что действие сработало.
   Живёт вне #app, поэтому переживает перерисовку страницы. */
function toast(text){
  let box = document.getElementById('toasts');
  if (!box){ box = $(`<div class="toasts" id="toasts"></div>`); document.body.appendChild(box); }
  const t = $(`<div class="toast">${esc(text)}</div>`);
  box.appendChild(t);
  requestAnimationFrame(() => t.classList.add('in'));
  setTimeout(() => { t.classList.remove('in'); setTimeout(() => t.remove(), 260); }, 2800);
}

let _prevScreen = null;
function render(){
  const app = document.getElementById('app');
  // Страница перерисовывается целиком, поэтому запоминаем, где человек стоял:
  // иначе после нажатия «Собрал» его выбрасывает наверх списка.
  const keepY = (_prevScreen === S.screen) ? window.scrollY : 0;
  _prevScreen = S.screen;
  app.innerHTML = '';
  // Серой плашки «Демонстрация…» больше нет — Максат убрал её с экрана.
  // Сброс демо-данных перед показом: открыть index.html?reset (см. СТАРТ).

  if (S.screen === 'login')        {
    // Фотография собранного проекта справа, растворяется в белый влево.
    app.appendChild($(`<div class="login-bg" style="--shot:url('guide/assets/proj11-photo.jpg')">
      <div class="login-bg-cap">
        <div class="n">Робототехника<br>на Arduino</div>
        <div class="t">от первого мигающего светодиода<br>до шагового мотора и кодового замка</div>
      </div>
    </div>`));
    app.appendChild(viewLogin());
  }
  else {
    app.appendChild(topbar());
    const w = $(`<div class="wrap"></div>`);
    if (S.screen === 'student') w.appendChild(viewStudent());
    if (S.screen === 'teacher') w.appendChild(viewTeacher());
    if (S.screen === 'admin')   w.appendChild(viewAdmin());
    app.appendChild(w);
  }
  if (S.modal) app.appendChild(S.modal());

  if (keepY) window.scrollTo(0, keepY);
  // подсветка карточки, которую только что изменили
  if (S.flash){
    const el = app.querySelector('[data-proj="' + S.flash + '"]');
    if (el){ el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1100); }
    S.flash = null;
  }
}

function topbar(){
  const who = S.role==='student' ? Store.db.students.find(s=>s.id===S.studentId)
            : S.role==='teacher' ? Store.teacher(S.teacherId) : {name:'Администратор'};
  const roleLabel = {student:'Ученик', teacher:'Преподаватель', admin:'Администратор'}[S.role];
  const bar = $(`<div class="topbar"><div class="topbar-in">
    <div class="brand" title="${esc(Store.db.school.name)}"><img class="lg-wide" src="logo.svg" alt="${esc(Store.db.school.name)}"><img class="lg-mark" src="logo-block.svg" alt=""><img class="lg-slim" src="logo-block.svg" alt=""></div>
    <div class="spacer"></div>
    <div class="who">${roleLabel}<b>${esc(who ? who.name : '')}</b></div>
    <button class="btn ghost sm" id="lo">Выйти</button>
  </div></div>`);
  bar.querySelector('#lo').onclick = logout;
  // Когда шапка сжата в полоску, знак слева работает как «наверх»:
  // нажал — страница уехала к началу, полная шапка вернулась сама.
  bar.querySelector('.brand').onclick = () => window.scrollTo({top:0, behavior:'smooth'});
  return bar;
}

/* ---------------------------- ВХОД ---------------------------- */
function viewLogin(){
  const el = $(`<div class="login"></div>`);

  // Название школы на входе: до входа шапки ещё нет, а человек должен сразу
  // видеть, куда он попал.
  el.appendChild($(`<div class="login-brand"><img class="lg-wide" src="logo-blue.svg" alt="${esc(Store.db.school.name)}"><img class="lg-mark" src="logo-block-blue.svg" alt=""></div>`));

  if (!S.role){
    el.appendChild($(`<h1>Кто ты?</h1>`));
    el.appendChild($(`<p class="lede">Платформа курса робототехники на Arduino. Выбери, как ты сюда заходишь.</p>`));
    const roles = $(`<div class="roles">
      <button class="role" data-r="student"><span class="ic">У</span><span><b>Я ученик</b><span>Отмечаю, какие проекты собрал, и говорю преподавателю, если застрял</span></span></button>
      <button class="role" data-r="teacher"><span class="ic">П</span><span><b>Я преподаватель</b><span>Вижу всю группу на одном экране: кто где, кто застрял и на чём</span></span></button>
      <button class="role" data-r="admin"><span class="ic">А</span><span><b>Я администратор</b><span>Группы, преподаватели, ученики, наборы и общая статистика школы</span></span></button>
    </div>`);
    roles.querySelectorAll('.role').forEach(b => b.onclick = () => { S.role = b.dataset.r; S.err=''; render(); });
    el.appendChild(roles);
    return el;
  }

  // ВХОД УЧЕНИКА — один шаг: свой личный код. В школе это номер лицевого
  // счёта — он у ребёнка уже есть, ничего нового запоминать не надо.
  // Раньше был код группы и выбор себя из списка — так любой мог зайти
  // за соседа; с настоящими детьми это не годится.
  if (S.role === 'student'){
    const p = $(`<div class="panel">
      <h1 style="font-size:31px;margin-bottom:6px">Твой код</h1>
      <p class="lede" style="margin-bottom:22px">${Store.live
        ? 'Это твой номер лицевого счёта в школе — тот же, что для оплаты. Если не помнишь, спроси у преподавателя.'
        : 'В демо подойдёт любой код от 1001 до 1025 — каждый открывает своего ученика.'}</p>
      <div class="field"><label>Код</label><input id="gc" placeholder="${Store.live ? '34040' : '1001'}" inputmode="numeric" autocomplete="off"></div>
      <div class="err">${esc(S.err)}</div>
      <div style="display:flex;gap:9px;margin-top:12px"><button class="btn primary" id="go">Войти</button><button class="btn ghost" id="bk">Назад</button></div>
    </div>`);
    const go = async () => {
      const code = p.querySelector('#gc').value.trim();
      if (!code){ S.err='Введи код.'; render(); return; }
      const notFound = 'Такого кода нет. Проверь цифры — код знает преподаватель.';
      let me;
      if (Store.live){
        try { me = await Store.loginStudent(code); }
        catch(e){ S.err = /нет/.test(e.message) ? notFound : e.message; render(); return; }
      } else {
        const s = Store.db.students.find(x => x.code === code);
        if (!s){ S.err = notFound; render(); return; }
        me = s.id;
      }
      const st = Store.db.students.find(x => x.id === me);
      S.studentId = me; S.studentCode = code; S.groupCode = st ? st.groupCode : null;
      S.screen = 'student'; S.err = ''; save(); render();
    };
    p.querySelector('#go').onclick = go;
    p.querySelector('#gc').onkeydown = e => { if(e.key==='Enter') go(); };
    p.querySelector('#bk').onclick = () => { S.role=null; S.err=''; render(); };
    el.appendChild(p); return el;
  }

  // ВХОД ПРЕПОДАВАТЕЛЯ — в два шага: выбор себя из списка, потом свой код.
  // Раньше код не спрашивали вовсе (только имя из списка) — удобно для демо
  // с выдуманными именами, но на настоящих детях это открытая дверь: любой
  // с телефона выбирает имя учителя и видит весь класс. Список остаётся —
  // это быстрее, чем печатать имя, — а код теперь обязателен для входа.
  if (S.role === 'teacher' && !S.pendingTeacherId){
    const list = Store.db.teachers;
    const p = $(`<div class="panel">
      <h1 style="font-size:31px;margin-bottom:6px">Кто ведёт занятие?</h1>
      <p class="lede" style="margin-bottom:20px">Выбери себя из списка преподавателей школы.</p>
      <div class="name-list"></div>
      <button class="btn ghost" id="bk">Назад</button>
    </div>`);
    const nl = p.querySelector('.name-list');
    if (!list.length) nl.appendChild($(`<div class="empty">
      <div class="ico">·</div>
      <div class="t">Преподаватели ещё не заведены</div>
      <div class="s">Список преподавателей заводит администратор школы.</div>
    </div>`));
    list.forEach(t => {
      const gs = Store.groupsOf(t.id).map(g => g.code).join(' · ');
      const b = $(`<button>${esc(t.name)}${gs ? `<span class="sub">${esc(gs)}</span>` : ''}</button>`);
      b.onclick = () => { S.pendingTeacherId = t.id; S.err=''; render(); };
      nl.appendChild(b);
    });
    p.querySelector('#bk').onclick = () => { S.role=null; S.err=''; render(); };
    el.appendChild(p); return el;
  }

  // Второй шаг — код именно этого преподавателя (его выдаёт администратор).
  if (S.role === 'teacher' && S.pendingTeacherId){
    const t = Store.teacher(S.pendingTeacherId);
    const p = $(`<div class="panel">
      <h1 style="font-size:31px;margin-bottom:6px">${esc(t ? t.name : '')}</h1>
      <p class="lede" style="margin-bottom:22px">Введи свой код — его выдаёт администратор школы.</p>
      <div class="field"><label>Код</label><input id="pin" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" style="-webkit-text-security:disc;text-security:disc"></div>
      <div class="err">${esc(S.err)}</div>
      <div style="display:flex;gap:9px;margin-top:12px"><button class="btn primary" id="go">Войти</button><button class="btn ghost" id="bk">Назад</button></div>
    </div>`);
    const go = async () => {
      const pin = p.querySelector('#pin').value.trim();
      if (!t){ S.err='Код не подошёл.'; render(); return; }
      if (Store.live){
        try { await Store.loginTeacher(t.id, pin); }
        catch(e){ S.err = e.message; render(); return; }
      } else if (pin !== t.pin){ S.err='Код не подошёл.'; render(); return; }
      S.teacherId = t.id; S.pendingTeacherId = null; S.screen = 'teacher';
      S.groupCode = (Store.groupsOf(t.id)[0] || {}).code || null;
      S.err = ''; save(); render();
    };
    p.querySelector('#go').onclick = go;
    p.querySelector('#pin').onkeydown = e => { if(e.key==='Enter') go(); };
    p.querySelector('#bk').onclick = () => { S.pendingTeacherId=null; S.err=''; render(); };
    el.appendChild(p); return el;
  }

  // преподаватель / админ — по коду
  const isT = S.role === 'teacher';
  const p = $(`<div class="panel">
    <h1 style="font-size:31px;margin-bottom:6px">${isT?'Вход преподавателя':'Вход администратора'}</h1>
    <p class="lede" style="margin-bottom:22px">${isT?'Введи свой код — его выдаёт администратор школы.':'Введи код администратора школы.'}</p>
    <div class="field"><label>Код</label><input id="pin" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" style="-webkit-text-security:disc;text-security:disc"></div>
    <div class="err">${esc(S.err)}</div>
    <div style="display:flex;gap:9px;margin-top:12px"><button class="btn primary" id="go">Войти</button><button class="btn ghost" id="bk">Назад</button></div>
  </div>`);
  const go = async () => {
    const pin = p.querySelector('#pin').value.trim();
    if (isT){
      const t = Store.db.teachers.find(x => x.pin === pin);
      if (!t){ S.err='Код не подошёл.'; render(); return; }
      S.teacherId=t.id; S.screen='teacher'; S.groupCode = (Store.groupsOf(t.id)[0]||{}).code || null; S.err=''; save(); render();
    } else {
      if (Store.live){
        try { await Store.loginAdmin(pin); }
        catch(e){ S.err = e.message; render(); return; }
      } else if (pin !== Store.db.school.adminPin){ S.err='Код не подошёл.'; render(); return; }
      S.screen='admin'; S.err=''; save(); render();
    }
  };
  p.querySelector('#go').onclick = go;
  p.querySelector('#pin').onkeydown = e => { if(e.key==='Enter') go(); };
  p.querySelector('#bk').onclick = () => { S.role=null; S.err=''; render(); };
  el.appendChild(p); return el;
}

/* ------------------------ КАБИНЕТ УЧЕНИКА ------------------------ */
function viewStudent(){
  const me = Store.db.students.find(s => s.id === S.studentId);
  const done = Store.doneCount(me.id);
  const pct = Math.round(done / NPROJ * 100);
  // Прогресс идёт строго по порядку. Отметить можно только текущий проект,
  // снять отметку — только с последнего собранного. Так в прогрессе не появится дырок.
  // «Следующий по программе» — первый несобранный. При свободном порядке это
  // остаётся правдой: платформа не утверждает, чем ученик занят прямо сейчас,
  // а показывает, куда идти дальше по курсу.
  const openNow = Store.firstOpen(me.id);
  const cur = PROJECTS.find(p => p.n === openNow) || null;

  const el = document.createDocumentFragment();
  const hero = $(`<div class="hero">
    <div class="big">${done}<small> / ${NPROJ}</small><div style="color:var(--ink-3);margin-top:8px">проектов собрано</div></div>
    <div class="grow">
      <div style="font-family:var(--serif);font-size:26px;margin-bottom:4px">${pct < 15 ? 'Только начинаем' : pct < 50 ? 'Хорошо идёшь' : pct < 100 ? 'Больше половины позади' : 'Весь курс пройден!'}</div>
      <p class="muted" style="font-size:13.5px">${cur ? 'Следующий по программе — <b style="color:var(--ink)">Проект ' + String(cur.n).padStart(2,'0') + ' · ' + esc(cur.t) + '</b>' : 'Все проекты закрыты. Красиво.'}</p>
      <div class="bar" style="margin-top:12px"><i style="width:${pct}%"></i></div>
    </div>
  </div>`);

  // Ученик возвращается из инструкции — и текущий проект уже здесь, вместе с обеими
  // кнопками. Иначе пришлось бы каждый раз искать свою карточку среди семнадцати.
  if (cur){
    // Фотография текущего проекта — справа в синем блоке, затемнённая
    // и растворяющаяся в фон. Текст слева лежит на плотном синем, поэтому
    // читаемость не страдает.
    hero.appendChild($(`<div class="hero-photo" style="background-image:url('guide/assets/${PHOTO[cur.n]}')"></div>`));

    const acts = $(`<div class="hero-acts"></div>`);
    acts.appendChild($(`<a class="btn" href="${CONFIG.GUIDE_URL}#proj-${cur.n}">Приступить</a>`));
    const hm = $(`<button class="mark"><span class="box"></span>Собрал</button>`);
    hm.onclick = async () => {
      try { await Store.setProgress(me.id, cur.n, 'done', ''); }
      catch(e){ toast(e.message); return; }
      S.flash = cur.n;
      const nx = PROJECTS.find(x => x.n === Store.firstOpen(me.id));
      toast(nx ? 'Проект ' + String(cur.n).padStart(2,'0') + ' собран. Дальше — ' + nx.t
               : 'Весь курс пройден!');
      render();
    };
    acts.appendChild(hm);
    hero.querySelector('.grow').appendChild(acts);
  }
  el.appendChild(hero);

  el.appendChild($(`<div class="section-head"><h2>Мои проекты</h2><span class="sub">Отмечай сам · преподаватель это видит</span></div>`));

  const grid = $(`<div class="proj-grid"></div>`);
  PROJECTS.forEach(p => {
    const pr = Store.prog(me.id, p.n);
    const st = Store.state(me.id, p.n);
    const isDone = st === 'done';

    const c = $(`<div class="pcard ${st}" data-proj="${p.n}">
      <div class="pthumb">${isDone ? `<span class="medal" aria-hidden="true">✓</span>` : ''}<img loading="lazy" src="guide/assets/${PHOTO[p.n]}" alt="${esc(p.t)}"></div>
      <div class="num">${String(p.n).padStart(2,'0')} · ${stars(p.s)} · ${p.m} мин</div>
      <h3>${esc(p.t)}</h3>
      ${st==='stuck' ? `<div><span class="chip stuck">Застрял</span></div>` : ''}
      ${st==='doing' ? `<div><span class="chip doing">Следующий</span></div>` : ''}
      ${st==='stuck' && pr.note ? `<div class="note">${esc(pr.note)}</div>` : ''}
    </div>`);

    // Урок открывается нажатием на саму карточку — отдельная кнопка не нужна.
    // Остаётся только «Не получается».
    const acts = $(`<div class="acts"></div>`);
    const help = $(`<button class="btn ghost tiny">${st==='stuck' ? 'Изменить' : 'Не получается'}</button>`);
    help.onclick = (e) => { e.stopPropagation(); askStuck(me.id, p); };
    acts.appendChild(help);
    c.appendChild(acts);

    // Кнопка-переключатель внизу: она же показывает состояние, она же его меняет.
    // Порядок свободный: ученик может начать с любого проекта. Кто-то приходит
    // уже умея, и заставлять его собирать мигающий светодиод ради очереди — значит
    // потерять его на первом занятии.
    const hint = isDone ? 'Нажми, если отметил по ошибке' : 'Нажми, когда проект заработает';
    const mark = $(`<button class="mark ${isDone?'on':''}" title="${hint}">
      <span class="box">${isDone?'✓':''}</span>Собрал
    </button>`);
    mark.onclick = async (e) => {
      e.stopPropagation();
      try { await Store.setProgress(me.id, p.n, isDone ? 'todo' : 'done', ''); }
      catch(err){ toast(err.message); return; }
      S.flash = p.n;
      if (!isDone){
        const nx = PROJECTS.find(x => x.n === Store.firstOpen(me.id));
        toast(nx ? 'Проект ' + String(p.n).padStart(2,'0') + ' собран. Дальше — ' + nx.t
                 : 'Проект ' + String(p.n).padStart(2,'0') + ' собран. Весь курс пройден!');
      } else {
        toast('Отметка снята с проекта ' + String(p.n).padStart(2,'0'));
      }
      render();
    };
    // «Собрал» и «Не получается» — обычный текст в одну строку, без рамок и
    // белых плашек: они сидят прямо на фоне карточки. Поэтому обе живут в
    // одном ряду .acts, а «Собрал» идёт первым — это главное действие.
    acts.insertBefore(mark, help);

    // Карточка целиком открывает урок: и мышью, и с клавиатуры (Enter или пробел).
    const openLesson = () => { location.href = CONFIG.GUIDE_URL + '#proj-' + p.n; };
    c.classList.add('clickable');
    c.setAttribute('role', 'link');
    c.setAttribute('tabindex', '0');
    c.setAttribute('aria-label', 'Открыть урок: проект ' + p.n + ', ' + p.t);
    c.onclick = openLesson;
    c.onkeydown = (e) => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLesson(); }
    };

    grid.appendChild(c);
  });
  el.appendChild(grid);
  const w = document.createElement('div'); w.appendChild(el); return w;
}

function askStuck(studentId, p){
  const prev = Store.prog(studentId, p.n).note;
  S.modal = () => {
    const bg = $(`<div class="modal-bg"><div class="modal">
      <h3>Что не получается?</h3>
      <p class="muted" style="font-size:13.5px">Проект ${String(p.n).padStart(2,'0')} · ${esc(p.t)}</p>
      <div class="field" style="margin-top:16px"><label>Опиши своими словами</label>
        <textarea id="nt" rows="4" placeholder="Например: подсветка горит, а текста на экране нет">${esc(prev)}</textarea></div>
      <p class="muted" style="font-size:13.5px">Преподаватель увидит это у себя и подойдёт к тебе на занятии.</p>
      <div class="actions"><button class="btn ghost" id="cancel">Отмена</button><button class="btn primary" id="ok">Отправить</button></div>
    </div></div>`);
    bg.querySelector('#cancel').onclick = () => { S.modal=null; render(); };
    bg.querySelector('#ok').onclick = async () => {
      const note = bg.querySelector('#nt').value.trim();
      S.modal=null;
      try { await Store.setProgress(studentId, p.n, 'stuck', note); }
      catch(err){ toast(err.message); render(); return; }
      S.flash = p.n;
      toast('Преподаватель увидит это у себя');
      render();
    };
    return bg;
  };
  render();
}

/* --------------------- КАБИНЕТ ПРЕПОДАВАТЕЛЯ --------------------- */
function viewTeacher(){
  const groups = Store.groupsOf(S.teacherId);
  const el = document.createDocumentFragment();

  if (!groups.length){ el.appendChild($(`<div class="card" style="margin-top:34px"><div class="empty">
    <div class="ico">👥</div>
    <div class="t">На вас пока не назначено ни одной группы</div>
    <div class="s">Группы создаёт администратор школы и назначает преподавателя. Как только вашу группу заведут, она появится здесь сама.</div>
  </div></div>`)); const w=document.createElement('div'); w.appendChild(el); return w; }
  if (!groups.some(g => g.code === S.groupCode)) S.groupCode = groups[0].code;

  /* Выбор группы — тот же переключатель, что у директора: до шести групп ряд
     кнопок, дальше выпадающий список. У преподавателя обычно одна-две группы,
     так что почти всегда это кнопки, и переключение стоит один клик вместо
     двух. Если группа всего одна, переключателя нет вовсе: выбирать не из
     чего, и кнопка-одиночка только сбивала бы с толку. */
  const gCur = Store.group(S.groupCode);
  const sel = $(`<div class="section-head has-sw"><h2>Группа</h2>${
    groups.length === 1 && gCur ? `<span class="sub">${esc(gCur.name)}</span>` : ''}</div>`);
  if (groups.length > 1){
    const box = $(`<div class="gsw"></div>`);
    if (groups.length > 6){
      const s2 = $(`<select>${groups.map(g => `<option value="${esc(g.code)}"${g.code===S.groupCode?' selected':''}>${esc(g.name)}</option>`).join('')}</select>`);
      s2.onchange = e => { S.groupCode = e.target.value; save(); render(); };
      box.appendChild(s2);
    } else {
      groups.forEach(g => {
        const b = $(`<button type="button" class="${g.code===S.groupCode?'on':''}" title="${esc(g.name)}">${esc(shortGroup(g))}</button>`);
        b.onclick = () => { S.groupCode = g.code; save(); render(); };
        box.appendChild(b);
      });
    }
    sel.appendChild(box);
  }
  el.appendChild(sel);

  const list = Store.studentsOf(S.groupCode);
  const totalCells = list.length * NPROJ;
  let doneC=0, stuckList=[];
  list.forEach(s => PROJECTS.forEach(p => {
    const pr = Store.prog(s.id, p.n);
    if (pr.status==='done') doneC++;
    if (pr.status==='stuck') stuckList.push({s, p, note:pr.note, at:pr.updated});
  }));
  // Порядок застрявших — по проектам, а не по ученикам. Дорого не дойти до
  // парты, дорого перезагрузить голову: «проект 04, зуммер, полярность» —
  // это одна картина, и пока она в голове, преподаватель поможет всем, кто
  // застрял на 04, почти не глядя в текст. А если после 04 сразу 10, урок
  // приходится читать заново. Внутри проекта первым идёт тот, кто ждёт
  // дольше. Даже когда у всех разные проекты, порядок по номеру — движение
  // в одну сторону по книге, а не метание из конца в конец.
  stuckList.sort((a,b) => (a.p.n - b.p.n) || String(a.at||'').localeCompare(String(b.at||'')));

  const avg = list.length ? (list.reduce((a,s)=>a+Store.doneCount(s.id),0)/list.length) : 0;

  /* --- Урок сегодня ----------------------------------------------------
     Материал нужен преподавателю в начале занятия, а не только когда
     кто-то застрял. Проект платформа определяет сама — берёт тот,
     на котором стоит большинство группы. Выпадающий список рядом,
     чтобы открыть любой другой: например, подготовиться к следующему. */
  if (list.length){
    const tally = {};
    list.forEach(s => { const n = Store.firstOpen(s.id); if (n) tally[n] = (tally[n] || 0) + 1; });
    let lessonN = PROJECTS[0].n, lessonCnt = 0;
    Object.keys(tally).forEach(k => { if (tally[k] > lessonCnt){ lessonCnt = tally[k]; lessonN = +k; } });
    const lp = PROJECTS.find(p => p.n === lessonN) || PROJECTS[0];

    const today = $(`<div class="card" style="display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:8px;padding:26px 26px">
      <div style="flex:1;min-width:250px">
        <div style="font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:8px">Урок сегодня</div>
        <div style="font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:.01em;font-size:26px;line-height:1.12">${String(lp.n).padStart(2,'0')} · ${esc(lp.t)}</div>
        <div class="muted" style="font-size:12.5px;margin-top:8px">Это текущий проект у ${lessonCnt} из ${list.length} учеников группы</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <select id="lsel" style="border:1.5px solid var(--rule-strong);background:var(--paper);padding:12px 14px;border-radius:4px;max-width:320px;font-size:12.5px">
          ${PROJECTS.map(p => `<option value="${p.n}" ${p.n===lessonN?'selected':''}>${String(p.n).padStart(2,'0')} · ${esc(p.t)}</option>`).join('')}
        </select>
        <a class="btn primary" id="lopen" target="_blank" href="${CONFIG.GUIDE_URL}#proj-${lessonN}">Открыть урок</a>
      </div>
    </div>`);
    today.querySelector('#lsel').onchange = e => {
      today.querySelector('#lopen').setAttribute('href', CONFIG.GUIDE_URL + '#proj-' + e.target.value);
    };
    el.appendChild(today);
  }

  /* --- кто застрял --- */
  // Список идёт сразу под «Уроком сегодня»: на занятии преподаватель смотрит
  // именно сюда, а общие числа по группе — это отчётность, им место ниже.
  // Счётчик застрявших стоит прямо в заголовке, чтобы не дублировать его плашкой.
  el.appendChild($(`<div class="section-head"><h2>Кому нужна помощь${stuckList.length?` <span class="cnt">${stuckList.length}</span>`:''}</h2></div>`));
  const sc = $(`<div class="card"></div>`);
  if (!stuckList.length) sc.appendChild($(`<div class="empty ok">
    <div class="ico">✓</div>
    <div class="t">Сейчас никто не застрял</div>
    <div class="s">Вся группа идёт без затыков. Если кто-то упрётся — он нажмёт «Не получается» у себя, и запись появится здесь.</div>
  </div>`));
  stuckList.forEach(({s,p,note,at}) => {
    const when = fmtWhen(at);
    const it = $(`<div class="stuck-item">
      <div class="badge">${String(p.n).padStart(2,'0')}</div>
      <div class="grow">
        <div class="nm-row"><span class="nm">${esc(s.name)}</span><span class="proj">${esc(p.t)}</span>${when ? `<span class="when">${when}</span>` : ''}</div>
        ${note ? `<div class="qt">«${esc(note)}»</div>` : `<div class="qt muted">Без описания</div>`}
      </div>
      <div class="acts"></div>
    </div>`);
    const box = it.lastElementChild;
    // Ученик застрял на конкретном проекте — преподавателю нужен именно он,
    // а не начало инструкции: листать оглавление при ученике неудобно.
    // Помощь одному ученику — это работа с началом и концом, поэтому урок
    // открывается в этой же вкладке, а не в новой: возврат «К группе» тогда
    // ведёт назад, а не создаёт вторую копию кабинета рядом.
    // В ссылке едут номер ученика и номер проекта — страница урока покажет
    // внизу, кому преподаватель помогает, даст отметить результат и сразу
    // предложит следующего застрявшего.
    const bg = $(`<a class="btn ghost sm" href="${CONFIG.GUIDE_URL}?help=${s.id}&proj=${p.n}#proj-${p.n}">Урок</a>`);
    // «Проект работает» ставит проект в собранные, «Помог, доделает» только снимает
    // отметку «застрял». Названия должны говорить, что произойдёт: преподаватель
    // выбирает между ними на ходу, стоя у стола ученика.
    const b1 = $(`<button class="btn sm">Проект работает</button>`);
    b1.onclick = async () => {
      try { await Store.setProgress(s.id, p.n, 'done', ''); }
      catch(err){ toast(err.message); return; }
      toast(s.name + ' — проект ' + String(p.n).padStart(2,'0') + ' отмечен собранным');
      render();
    };
    const b2 = $(`<button class="btn ghost sm">Помог, доделает</button>`);
    b2.onclick = async () => {
      try { await Store.setProgress(s.id, p.n, 'doing', ''); }
      catch(err){ toast(err.message); return; }
      toast(s.name + ' — отметка «застрял» снята, доделывает');
      render();
    };
    box.append(bg, b1, b2);
    sc.appendChild(it);
  });
  el.appendChild(sc);

  el.appendChild($(`<div class="stat-row stat-row-after">
    <div class="stat"><div class="l">Учеников</div><div class="v">${list.length}</div></div>
    <div class="stat"><div class="l">Средний прогресс</div><div class="v">${avg.toFixed(1)}<small> / ${NPROJ}</small></div></div>
    <div class="stat"><div class="l">Проектов закрыто</div><div class="v">${doneC}<small> / ${totalCells}</small></div></div>
  </div>`));

  /* --- матрица --- */
  el.appendChild($(`<div class="section-head"><h2>Вся группа на одном экране</h2></div>`));
  const wrapx = $(`<div class="scrollx"></div>`);
  const tbl = $(`<table class="mx">
    <thead><tr><th style="text-align:left;padding-left:12px">Ученик</th>${PROJECTS.map(p=>`<th title="${esc(p.t)} — открыть урок"><a class="mxh" target="_blank" href="${CONFIG.GUIDE_URL}#proj-${p.n}">${String(p.n).padStart(2,'0')}</a></th>`).join('')}<th>Итого</th></tr></thead>
    <tbody></tbody></table>`);
  const tb = tbl.querySelector('tbody');
  // Код входа стоит рядом с именем: ребёнок забыл — преподаватель подсказал,
  // не выходя из кабинета. Мелко и серо, чтобы не спорить с именем.
  list.forEach(s => {
    const tr = $(`<tr><th>${esc(s.name)}${s.code ? ` <span class="muted" style="font-family:var(--mono);font-size:12px;font-weight:400;margin-left:6px">${esc(s.code)}</span>` : ''}</th></tr>`);
    PROJECTS.forEach(p => {
      const pr = Store.prog(s.id, p.n);
      const cs = Store.state(s.id, p.n);
      const td = $(`<td class="cell"><i class="s-${cs}" title="${esc(s.name)} · Проект ${p.n} · ${STATUS[cs].label}${pr.note?' — '+esc(pr.note):''}">${STATUS[cs].short}</i></td>`);
      tr.appendChild(td);
    });
    tr.appendChild($(`<td style="text-align:center;font-family:var(--mono);font-size:12px;padding:0 8px">${Store.doneCount(s.id)}</td>`));
    tb.appendChild(tr);
  });
  wrapx.appendChild(tbl);
  el.appendChild(wrapx);
  el.appendChild($(`<div class="legend">
    <span><i style="background:var(--green)"></i> собрано</span>
    <span><i style="background:#F0D98A"></i> делает сейчас</span>
    <span><i style="background:var(--signal)"></i> застрял</span>
    <span><i style="background:var(--paper)"></i> ещё не начинал</span>
    <span class="muted">наведи курсор на клетку — покажет, что именно не получается</span>
    <span class="muted">нажми на номер проекта в шапке — откроется урок по нему</span>
  </div>`));

  const w = document.createElement('div'); w.appendChild(el); return w;
}

/* ---------------------- КАБИНЕТ АДМИНИСТРАТОРА ---------------------- */
function viewAdmin(){
  const el = document.createDocumentFragment();
  const db = Store.db;

  /* --- вся школа или одна группа ---------------------------------------
     По умолчанию директор смотрит школу целиком. Но перед разговором с
     конкретным преподавателем ему нужна одна группа: в общих числах её
     провал не виден, он растворяется среди остальных. Переключатель меняет
     всё, что ниже, — числа, графики и списки. «Группы в сравнении» остаются
     полными: в них весь смысл как раз в том, чтобы видеть остальных рядом. */
  const scope = (S.adminGroup && db.groups.some(g => g.code === S.adminGroup)) ? S.adminGroup : null;
  const gObj  = scope ? Store.group(scope) : null;
  const gTea  = gObj ? Store.teacher(gObj.teacherId) : null;
  const stu   = scope ? Store.studentsOf(scope) : db.students;
  const ids   = scope ? new Set(stu.map(s => s.id)) : null;

  /* Переключатель групп — одна и та же деталь в двух местах страницы: здесь,
     рядом с числами, и внизу у таблицы. Внизу он нужен потому, что таблица —
     самый конец длинной страницы, и возвращаться наверх ради смены группы
     это лишний путь. Состояние одно (S.adminGroup), поэтому оба показывают
     одно и то же и меняют всё, что ниже.

     До шести групп — ряд кнопок: варианты видны сразу, переключение в один
     клик, и заодно видно, сколько всего групп в школе. Дальше кнопки
     перестают помещаться в строку, и честнее выпадающий список — он не
     растёт вместе со школой. */
  const groupSwitch = () => {
    const box = $(`<div class="gsw"></div>`);
    if (db.groups.length > 6){
      const sel = $(`<select>
        <option value="">Вся школа</option>
        ${db.groups.map(g => `<option value="${esc(g.code)}"${g.code===scope?' selected':''}>${esc(g.name)}</option>`).join('')}
      </select>`);
      sel.onchange = e => { S.adminGroup = e.target.value || null; save(); render(); };
      box.appendChild(sel);
      return box;
    }
    const mk = (label, code, full) => {
      const b = $(`<button type="button" class="${code === scope ? 'on' : ''}" title="${esc(full)}">${esc(label)}</button>`);
      b.onclick = () => { S.adminGroup = code; save(); render(); };
      return b;
    };
    box.appendChild(mk('Вся школа', null, 'Все группы школы'));
    db.groups.forEach(g => box.appendChild(mk(shortGroup(g), g.code, g.name)));
    return box;
  };

  const head = $(`<div class="section-head has-sw"><h2>${scope ? 'Группа' : 'Вся школа'}</h2>${
    gObj ? `<span class="sub">${esc(gObj.name)}${gTea ? ' · ' + esc(gTea.name) : ''}</span>` : ''}</div>`);
  if (db.groups.length) head.appendChild(groupSwitch());
  el.appendChild(head);

  const totalDone = stu.reduce((a,s) => a + Store.doneCount(s.id), 0);
  const kits = stu.filter(s => s.kit).length;
  let stuckNow = 0;
  stu.forEach(s => PROJECTS.forEach(p => { if (Store.prog(s.id, p.n).status === 'stuck') stuckNow++; }));
  el.appendChild($(`<div class="stat-row" style="margin-top:26px">
    ${scope ? '' : `<div class="stat"><div class="l">Групп</div><div class="v">${db.groups.length}</div></div>`}
    <div class="stat"><div class="l">Учеников</div><div class="v">${stu.length}</div></div>
    ${scope ? `<div class="stat"><div class="l">Застряли сейчас</div><div class="v">${stuckNow}</div></div>`
            : `<div class="stat"><div class="l">Преподавателей</div><div class="v">${db.teachers.length}</div></div>`}
    <div class="stat"><div class="l">Наборы выданы</div><div class="v">${kits}<small> / ${stu.length}</small></div></div>
    <div class="stat"><div class="l">Проектов собрано</div><div class="v">${totalDone}</div></div>
  </div>`));

  /* --- Темп и доходимость ----------------------------------------------
     «Проектов собрано» — число, которое только растёт и ничего не говорит:
     оно одинаково хорошо выглядит и когда школа идёт, и когда встала.
     Директору нужны два других вопроса: ускоряемся мы или тормозим,
     и сколько детей вообще доходит до конца курса, а не бросает на третьем. */
  const weeks = [];
  for (let i = 5; i >= 0; i--) weeks.push({ i, n: Store.doneBetween(7*(i+1), 7*i, ids) });
  const wMax   = Math.max(1, ...weeks.map(w => w.n));
  const thisW  = weeks[5].n, prevW = weeks[4].n;
  const delta  = thisW - prevW;
  const dTxt   = delta > 0 ? `на ${delta} ${plural(delta,'проект','проекта','проектов')} больше, чем неделей раньше`
               : delta < 0 ? `на ${-delta} ${plural(-delta,'проект','проекта','проектов')} меньше, чем неделей раньше`
               : 'столько же, сколько неделей раньше';

  const half     = Math.ceil(NPROJ / 2);
  const started  = stu.filter(s => Store.doneCount(s.id) >= 1).length;
  const midway   = stu.filter(s => Store.doneCount(s.id) >= half).length;
  const finished = stu.filter(s => Store.doneCount(s.id) >= NPROJ).length;
  const NS = stu.length;
  const pctOf = (v) => NS ? Math.round(v / NS * 100) : 0;

  el.appendChild($(`<div class="section-head"><h2>Темп и доходимость</h2><span class="sub">За последние шесть недель</span></div>`));
  const twoTop = $(`<div class="two"></div>`);

  twoTop.appendChild($(`<div class="card">
    <div class="stat" style="margin:0 0 6px"><div class="l">Собрано за 7 дней</div><div class="v">${thisW}</div></div>
    <p class="muted" style="font-size:13.5px;margin:0;line-height:1.5">${dTxt}</p>
    <div class="spark">${weeks.map(w => `<div class="col${w.i===0?' now':''}" title="${w.n} ${plural(w.n,'проект','проекта','проектов')}"><i style="height:${Math.round(w.n / wMax * 100)}%"></i></div>`).join('')}</div>
    <div class="spark-x">${weeks.map(w => `<span>${w.i===0?'эта':'−'+w.i}</span>`).join('')}</div>
    <p class="muted" style="font-size:13.5px;margin:14px 0 0;line-height:1.5">Каждый столбик — одна неделя, слева самая давняя, справа текущая. Высота — сколько проектов ${scope ? 'группа' : 'вся школа'} закрыла за ту неделю. Ровный ряд значит стабильный ход, проседание справа — что-то мешает прямо сейчас.</p>
  </div>`));

  const funnel = [
    {t:'Начали',            s:'собрали хотя бы один проект',        v:started},
    {t:'Дошли до середины', s:`собрали ${half} и больше из ${NPROJ}`, v:midway},
    {t:'Прошли весь курс',  s:`все ${NPROJ} проектов`,               v:finished}
  ];
  twoTop.appendChild($(`<div class="card">
    <div class="funnel">${funnel.map(f => `
      <div class="fr">
        <div class="fh"><span class="ft">${f.t}</span><span class="fv">${f.v}<small> из ${NS}</small></span></div>
        <div class="bar"><i style="width:${pctOf(f.v)}%"></i></div>
        <div class="fs">${f.s}</div>
      </div>`).join('')}</div>
    <p class="muted" style="font-size:13.5px;margin:16px 0 0;line-height:1.5">Три ступени одной воронки: сколько детей вообще стартовало, сколько добралось до середины и сколько дошло до конца. Обрыв между первой и второй строкой — это те, кто бросил в начале; между второй и третьей — те, кто устал на финише.</p>
  </div>`));
  el.appendChild(twoTop);

  /* --- Кто застревает надолго и кто пропал -----------------------------
     Обычный «застрял» преподаватель разбирает на ближайшем занятии.
     Директору нужны те двое, кого система пропустила: ребёнок, который
     держит один и тот же затык больше недели, и ребёнок, который просто
     перестал что-либо отмечать — в общей статистике он не виден никак. */
  const stuckLong = [];
  stu.forEach(s => PROJECTS.forEach(pr => {
    const r = Store.prog(s.id, pr.n);
    if (r.status !== 'stuck') return;
    const d = Store.daysSince(r.updated);
    if (d === null || d < 7) return;
    stuckLong.push({s, p:pr, d, note:r.note, g:Store.group(s.groupCode)});
  }));
  stuckLong.sort((a,b) => b.d - a.d);

  const idle = []; let never = 0;
  stu.forEach(s => {
    const lt = Store.lastTouch(s.id);
    if (!lt){ never++; return; }
    const d = Store.daysSince(lt);
    if (d !== null && d >= 14) idle.push({s, d, g:Store.group(s.groupCode), done:Store.doneCount(s.id)});
  });
  idle.sort((a,b) => b.d - a.d);

  el.appendChild($(`<div class="section-head"><h2>Требуют внимания</h2><span class="sub">${stuckLong.length + idle.length ? stuckLong.length + idle.length + ' ' + plural(stuckLong.length + idle.length,'запись','записи','записей') : 'чисто'}</span></div>`));
  const twoAtt = $(`<div class="two"></div>`);

  const cStuck = $(`<div class="card"><h3 class="cardh">Застряли дольше недели</h3></div>`);
  if (!stuckLong.length) cStuck.appendChild($(`<div class="empty ok">
    <div class="ico">✓</div>
    <div class="t">Таких нет</div>
    <div class="s">Все затыки разбираются в течение недели. Сюда попадает ученик, который нажал «Не получается» и с тех пор так и не сдвинулся.</div>
  </div>`));
  else {
    const t1 = $(`<table class="list"><thead><tr><th>Ученик</th><th>Группа</th><th>Проект</th><th>Ждёт</th></tr></thead><tbody></tbody></table>`);
    const b1 = t1.querySelector('tbody');
    stuckLong.forEach(r => b1.appendChild($(`<tr>
      <td><b>${esc(r.s.name)}</b>${r.note ? `<div class="qn muted" style="font-size:13.5px;margin-top:3px;line-height:1.45;max-width:34ch">«${esc(r.note)}»</div>` : ''}</td>
      <td style="white-space:nowrap">${esc(gShort(r.g))}</td>
      <td>${String(r.p.n).padStart(2,'0')}<span class="pt"> · ${esc(r.p.t)}</span></td>
      <td style="white-space:nowrap"><span class="chip stuck">${r.d} ${plural(r.d,'день','дня','дней')}</span></td>
    </tr>`)));
    const s1 = $(`<div class="tscroll"></div>`); s1.appendChild(t1); cStuck.appendChild(s1);
    cStuck.appendChild($(`<p class="muted" style="font-size:13.5px;margin:14px 0 0;line-height:1.5">Ребёнок сам написал, что не получается, и с того дня ничего не изменилось. Больше недели на одном месте — это уже не «не разобрался», а «его не дождались»: стоит спросить преподавателя, что там произошло.</p>`));
  }
  twoAtt.appendChild(cStuck);

  const cIdle = $(`<div class="card"><h3 class="cardh">Не двигаются две недели</h3></div>`);
  if (!idle.length) cIdle.appendChild($(`<div class="empty ok">
    <div class="ico">✓</div>
    <div class="t">Все на связи</div>
    <div class="s">У каждого ученика есть отметка за последние две недели. Сюда попадёт тот, кто перестал отмечать проекты — обычно это значит, что он перестал ходить.</div>
  </div>`));
  else {
    const t2 = $(`<table class="list"><thead><tr><th>Ученик</th><th>Группа</th><th>Собрано</th><th>Тишина</th></tr></thead><tbody></tbody></table>`);
    const b2 = t2.querySelector('tbody');
    idle.forEach(r => b2.appendChild($(`<tr>
      <td><b>${esc(r.s.name)}</b></td>
      <td style="white-space:nowrap">${esc(gShort(r.g))}</td>
      <td>${r.done} / ${NPROJ}</td>
      <td style="white-space:nowrap"><span class="chip stuck">${r.d} ${plural(r.d,'день','дня','дней')}</span></td>
    </tr>`)));
    const s2 = $(`<div class="tscroll"></div>`); s2.appendChild(t2); cIdle.appendChild(s2);
    cIdle.appendChild($(`<p class="muted" style="font-size:13.5px;margin:14px 0 0;line-height:1.5">Последняя отметка старше двух недель. Такой ученик не застрял — он молча выпал, и ни одна другая цифра на этой странице этого не покажет: его прогресс просто перестал меняться.${never ? ` Ещё ${never} ${plural(never,'ученик','ученика','учеников')} не ${plural(never,'отметил','отметили','отметили')} ни одного проекта — они пока нигде не считаются.` : ''}</p>`));
  }
  twoAtt.appendChild(cIdle);
  el.appendChild(twoAtt);

  /* --- Группы в сравнении ---------------------------------------------
     Преподаватель видит только свою группу, и сравнить её ему не с чем.
     Директору нужно видеть все рядом: одинаковый курс, разный темп —
     это уже повод для разговора с преподавателем, а не с детьми. */
  el.appendChild($(`<div class="section-head"><h2>Группы в сравнении</h2><span class="sub">Один курс · разный темп</span></div>`));
  const cmp = $(`<div class="card"></div>`);
  if (!db.groups.length) cmp.appendChild($(`<div class="empty">Групп пока нет</div>`));
  else {
    const rows = db.groups.map(g => {
      const list = Store.studentsOf(g.code);
      let stuck = 0;
      list.forEach(s => PROJECTS.forEach(p => { if (Store.prog(s.id, p.n).status === 'stuck') stuck++; }));
      const avg  = list.length ? list.reduce((a,s) => a + Store.doneCount(s.id), 0) / list.length : 0;
      const kits = list.filter(s => s.kit).length;
      return {g, list, stuck, avg, kits, t: Store.teacher(g.teacherId)};
    }).sort((a,b) => b.avg - a.avg);

    const tbl = $(`<table class="list"><thead><tr>
      <th>Группа</th><th>Преподаватель</th><th>Учеников</th>
      <th>Средний прогресс</th><th>Застряли</th><th>Наборы</th>
    </tr></thead><tbody></tbody></table>`);
    const tb = tbl.querySelector('tbody');
    rows.forEach((r, i) => {
      const pct = Math.round(r.avg / NPROJ * 100);
      const last = (i === rows.length - 1 && rows.length > 1);
      // Строка выбранной группы подсвечена: сравнение имеет смысл только
      // рядом с остальными, поэтому список не режем, а помечаем место.
      tb.appendChild($(`<tr${r.g.code===scope?' style="background:var(--paper-3)"':''}>
        <td><b>${esc(r.g.name)}</b></td>
        <td>${esc(r.t ? r.t.name : '—')}</td>
        <td>${r.list.length}</td>
        <td style="min-width:220px">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums">${r.avg.toFixed(1)} / ${NPROJ}</span>
            <div class="bar" style="flex:1"><i style="width:${pct}%"></i></div>
          </div>
        </td>
        <td>${r.stuck ? `<span class="chip stuck">${r.stuck}</span>` : `<span class="muted">—</span>`}</td>
        <td>${r.kits} / ${r.list.length}${last ? '' : ''}</td>
      </tr>`));
    });
    cmp.appendChild(tbl);
    cmp.appendChild($(`<p class="muted" style="font-size:13.5px;margin:14px 0 0;line-height:1.5">Группы отсортированы по среднему прогрессу — сверху те, кто идёт быстрее. Нижняя строка отстаёт: курс у всех одинаковый, значит разница в темпе это вопрос к организации занятий, а не к детям.</p>`));
  }
  el.appendChild(cmp);

  /* --- Вся школа по проектам ------------------------------------------
     У преподавателя такая таблица есть по его группе. Директору нужна та же
     картина, но по всем группам сразу: где кто стоит, кто застрял, и как
     группы выглядят рядом друг с другом на одних и тех же столбцах. */
  /* Переключатель групп стоит прямо у таблицы: она в самом низу страницы,
     и возвращаться к селектору наверху ради смены группы — лишний путь.
     Состояние то же самое (S.adminGroup), поэтому числа и графики выше
     меняются вместе с таблицей. Двух разных «выбранных групп» на одном
     экране быть не должно — директор перестал бы понимать, к чему относится
     цифра, на которую он смотрит. */
  /* «Прогресс каждого». Слово «прогресс» на платформе уже работает: столбец
     «Средний прогресс» в «Группах в сравнении» и в кабинете преподавателя,
     столбец «Прогресс» в списке учеников. Таблица ниже — про ровно то же
     самое, поэтому она называется тем же словом: одно понятие — одно слово,
     директору не нужно учить второе.

     «Каждого» — чтобы пара с соседним блоком читалась сама: выше «Группы в
     сравнении» со средним по группе, ниже — тот же прогресс, но поимённо.
     Заголовок не меняется при смене группы: что выбрано, видно по кнопкам. */
  const headA = $(`<div class="section-head has-sw"><h2>Прогресс каждого</h2></div>`);
  if (db.groups.length) headA.appendChild(groupSwitch());
  el.appendChild(headA);
  const wrapA = $(`<div class="scrollx"></div>`);
  const tblA = $(`<table class="mx">
    <thead><tr><th style="text-align:left;padding-left:12px">Ученик</th>${PROJECTS.map(p=>`<th title="${esc(p.t)} — открыть урок"><a class="mxh" target="_blank" href="${CONFIG.GUIDE_URL}#proj-${p.n}">${String(p.n).padStart(2,'0')}</a></th>`).join('')}<th>Итого</th></tr></thead>
    <tbody></tbody></table>`);
  const tbA = tblA.querySelector('tbody');

  const groupsA = scope ? db.groups.filter(g => g.code === scope) : db.groups;
  if (!groupsA.length){
    tbA.appendChild($(`<tr><td colspan="${NPROJ+2}" class="empty">Групп пока нет</td></tr>`));
  } else groupsA.forEach(g => {
    const list = Store.studentsOf(g.code);
    const t = Store.teacher(g.teacherId);
    let stuckG = 0;
    list.forEach(s => PROJECTS.forEach(p => { if (Store.prog(s.id,p.n).status==='stuck') stuckG++; }));
    const avgG = list.length ? (list.reduce((a,s)=>a+Store.doneCount(s.id),0)/list.length) : 0;

    tbA.appendChild($(`<tr class="mx-grp"><th colspan="${NPROJ+2}">
      ${esc(g.name)} <span class="s">${esc(t?t.name:'без преподавателя')} · ${list.length} чел. · в среднем ${avgG.toFixed(1)} из ${NPROJ}${stuckG?' · застряли '+stuckG:''}</span>
    </th></tr>`));

    if (!list.length){
      tbA.appendChild($(`<tr><td colspan="${NPROJ+2}" class="muted" style="padding:10px 15px">В группе пока нет учеников</td></tr>`));
      return;
    }
    list.forEach(s => {
      const tr = $(`<tr><th>${esc(s.name)}</th></tr>`);
      PROJECTS.forEach(p => {
        const pr = Store.prog(s.id, p.n);
        const cs = Store.state(s.id, p.n);
        tr.appendChild($(`<td class="cell"><i class="s-${cs}" title="${esc(s.name)} · Проект ${p.n} · ${STATUS[cs].label}${pr.note?' — '+esc(pr.note):''}">${STATUS[cs].short}</i></td>`));
      });
      tr.appendChild($(`<td style="text-align:center;font-family:var(--mono);font-size:12px;padding:0 8px">${Store.doneCount(s.id)}</td>`));
      tbA.appendChild(tr);
    });
  });
  wrapA.appendChild(tblA);
  el.appendChild(wrapA);
  el.appendChild($(`<div class="legend">
    <span><i style="background:var(--green)"></i> собрано</span>
    <span><i style="background:#F0D98A"></i> делает сейчас</span>
    <span><i style="background:var(--signal)"></i> застрял</span>
    <span><i style="background:var(--paper)"></i> ещё не начинал</span>
    <span class="muted">наведи курсор на клетку — покажет, что именно не получается</span>
  </div>`));

  const tabs = $(`<div class="tabs" style="margin-top:30px">
    <button data-t="groups"   class="${S.tab==='groups'?'on':''}">Группы</button>
    <button data-t="students" class="${S.tab==='students'?'on':''}">Ученики и наборы</button>
    <button data-t="teachers" class="${S.tab==='teachers'?'on':''}">Преподаватели</button>
  </div>`);
  tabs.querySelectorAll('button').forEach(b => b.onclick = () => { S.tab=b.dataset.t; render(); });
  el.appendChild(tabs);

  if (S.tab === 'groups')   el.appendChild(adminGroups());
  if (S.tab === 'students') el.appendChild(adminStudents());
  if (S.tab === 'teachers') el.appendChild(adminTeachers());

  const w = document.createElement('div'); w.appendChild(el); return w;
}

function adminGroups(){
  const box = $(`<div class="two"></div>`);
  // Кода группы в таблице больше нет: ученики входят личными кодами, а
  // внутренний ключ группы человеку ни к чему.
  const left = $(`<div class="card"><table class="list"><thead><tr><th>Название</th><th>Преподаватель</th><th>Учеников</th><th></th></tr></thead><tbody></tbody></table></div>`);
  const tb = left.querySelector('tbody');
  if (!Store.db.groups.length) tb.appendChild($(`<tr><td colspan="4" class="empty">Групп пока нет</td></tr>`));
  Store.db.groups.forEach(g => {
    const t = Store.teacher(g.teacherId);
    const tr = $(`<tr>
      <td>${esc(g.name)}</td>
      <td>${esc(t?t.name:'—')}</td>
      <td>${Store.studentsOf(g.code).length}</td>
      <td style="text-align:right"></td></tr>`);
    const del = $(`<button class="btn ghost tiny">Удалить</button>`);
    del.onclick = async () => {
      if(!confirmish('Удалить группу «'+g.name+'» вместе с её учениками?')) return;
      try { await Store.delGroup(g.code); render(); } catch(e){ toast(e.message); }
    };
    tr.lastElementChild.appendChild(del);
    tb.appendChild(tr);
  });

  // Внутренний ключ группы придумывает сервер (в демо — сами), человек его
  // не видит и не вводит: ученики входят личными кодами.
  const right = $(`<div class="card">
    <h3 style="font-family:var(--serif);font-size:22px;margin-bottom:12px">Новая группа</h3>
    <div class="field"><label>Название (что видит преподаватель)</label><input id="gn" placeholder="Робототехника · 6А · вт/чт 15:00"></div>
    <div class="field"><label>Преподаватель</label><select id="gt">${Store.db.teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>
    <div class="err" id="ge"></div>
    <button class="btn primary" id="gadd">Создать группу</button>
  </div>`);
  right.querySelector('#gadd').onclick = async () => {
    const name = right.querySelector('#gn').value.trim();
    const code = Store.live ? '' : 'G-' + Math.random().toString(36).slice(2, 8).toUpperCase();
    const teacherId = right.querySelector('#gt').value;
    const e = right.querySelector('#ge');
    if (!name){ e.textContent = 'Напиши название группы.'; return; }
    if (!teacherId){ e.textContent='Сначала добавь хотя бы одного преподавателя.'; return; }
    try {
      await Store.addGroup({code, name, teacherId});
      render();
      toast('Группа «' + name + '» создана.');
    } catch(err){ e.textContent = err.message; }
  };
  box.append(left, right); return box;
}

function adminStudents(){
  const box = $(`<div class="two"></div>`);
  // Группа — по названию, не по внутреннему коду: код ничего не говорит человеку.
  // Код ученика — это его вход; клик по нему даёт поправить опечатку из таблицы.
  const gname = code => { const g = Store.group(code); return g ? shortGroup(g) : '—'; };
  const left = $(`<div class="card"><table class="list"><thead><tr><th>Ученик</th><th>Код</th><th>Группа</th><th>Прогресс</th><th>Набор</th><th></th></tr></thead><tbody></tbody></table></div>`);
  const tb = left.querySelector('tbody');
  if (!Store.db.students.length) tb.appendChild($(`<tr><td colspan="6" class="empty">Учеников пока нет</td></tr>`));
  Store.db.students.forEach(s => {
    const tr = $(`<tr><td>${esc(s.name)}</td><td></td><td>${esc(gname(s.groupCode))}</td>
      <td>${Store.doneCount(s.id)} / ${NPROJ}</td><td></td><td style="text-align:right"></td></tr>`);
    const cb = $(`<button class="btn ghost tiny" style="font-family:var(--mono)" title="Изменить код">${s.code ? esc(s.code) : 'нет кода'}</button>`);
    cb.onclick = async () => {
      const v = prompt('Код ученика «' + s.name + '»:', s.code || '');
      if (v === null) return;
      const nc = v.trim();
      if (!nc){ toast('Код не может быть пустым.'); return; }
      try { await Store.setStudentCode(s.id, nc); render(); } catch(e){ toast(e.message); }
    };
    tr.children[1].appendChild(cb);
    const kb = $(`<button class="btn ${s.kit?'':'ghost'} tiny">${s.kit?'выдан':'нет'}</button>`);
    kb.onclick = async () => { try { await Store.setKit(s.id, !s.kit); render(); } catch(e){ toast(e.message); } };
    tr.children[4].appendChild(kb);
    const del = $(`<button class="btn ghost tiny">Удалить</button>`);
    del.onclick = async () => {
      if(!confirmish('Удалить ученика «'+s.name+'»?')) return;
      try { await Store.delStudent(s.id); render(); } catch(e){ toast(e.message); }
    };
    tr.lastElementChild.appendChild(del);
    tb.appendChild(tr);
  });

  const right = $(`<div class="card">
    <h3 style="font-family:var(--serif);font-size:22px;margin-bottom:6px">Добавить учеников</h3>
    <p class="muted" style="font-size:13.5px">Вставь список из таблицы — в строке имя и код ученика (номер лицевого счёта). Два столбца из Excel вставляются как есть.</p>
    <div class="field"><label>Группа</label><select id="sg">${Store.db.groups.map(g=>`<option value="${esc(g.code)}">${esc(g.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Имена и коды</label><textarea id="sn" rows="7" placeholder="Азамат Жумабеков	34040&#10;Алина Ким	34077&#10;Бекзат Турсунов	34038"></textarea></div>
    <div class="err" id="se"></div>
    <button class="btn primary" id="sadd">Добавить</button>
  </div>`);
  right.querySelector('#sadd').onclick = async () => {
    const code = right.querySelector('#sg').value;
    const e = right.querySelector('#se');
    // Строка: «Имя Фамилия <таб или пробелы> код». Код — последнее слово из
    // букв и цифр; если его нет, говорим про какую строку речь, а не
    // молча пропускаем — потом такого ученика не найти.
    const rows = [];
    for (const line of right.querySelector('#sn').value.split('\n')){
      const t = line.trim(); if (!t) continue;
      const m = t.match(/^(.*?)[\s;,]+([A-Za-z0-9-]{3,32})$/);
      if (!m || !m[1].trim()){ e.textContent = 'В строке «' + t + '» не нашёл код. Нужно: имя, потом код.'; return; }
      rows.push({name: m[1].trim(), code: m[2]});
    }
    if (!code){ e.textContent='Сначала создай группу.'; return; }
    if (!rows.length){ e.textContent='Список пустой.'; return; }
    try { await Store.addStudents(code, rows); render(); } catch(err){ e.textContent = err.message; }
  };
  box.append(left, right); return box;
}

function adminTeachers(){
  const box = $(`<div class="two"></div>`);
  const left = $(`<div class="card"><table class="list"><thead><tr><th>Преподаватель</th><th>Код входа</th><th>Групп</th><th></th></tr></thead><tbody></tbody></table></div>`);
  const tb = left.querySelector('tbody');
  if (!Store.db.teachers.length) tb.appendChild($(`<tr><td colspan="4" class="empty">Преподавателей пока нет</td></tr>`));
  Store.db.teachers.forEach(t => {
    const tr = $(`<tr><td>${esc(t.name)}</td>
      <td><code style="font-family:var(--mono);background:var(--paper-3);padding:2px 6px;border-radius:2px">${esc(t.pin || '••••')}</code></td>
      <td>${Store.groupsOf(t.id).length}</td><td style="text-align:right"></td></tr>`);
    const del = $(`<button class="btn ghost tiny">Удалить</button>`);
    del.onclick = async () => {
      if(!confirmish('Удалить преподавателя «'+t.name+'»?')) return;
      try { await Store.delTeacher(t.id); render(); } catch(e){ toast(e.message); }
    };
    tr.lastElementChild.appendChild(del);
    tb.appendChild(tr);
  });

  const right = $(`<div class="card">
    <h3 style="font-family:var(--serif);font-size:22px;margin-bottom:12px">Новый преподаватель</h3>
    <div class="field"><label>Имя</label><input id="tn" placeholder="Айгуль Осмоналиева"></div>
    <div class="field"><label>Код входа (4 цифры)</label><input id="tp" inputmode="numeric" placeholder="3333"></div>
    <div class="err" id="te"></div>
    <button class="btn primary" id="tadd">Добавить</button>
  </div>`);
  right.querySelector('#tadd').onclick = async () => {
    const name = right.querySelector('#tn').value.trim();
    const pin = right.querySelector('#tp').value.trim();
    const e = right.querySelector('#te');
    if (!name || !pin){ e.textContent='Заполни имя и код.'; return; }
    if (!/^\d{4,}$/.test(pin)){ e.textContent='Код — только цифры, не меньше четырёх.'; return; }
    if (!Store.live && (Store.db.teachers.some(t=>t.pin===pin) || pin===Store.db.school.adminPin)){ e.textContent='Такой код уже занят — придумай другой.'; return; }
    try { await Store.addTeacher({id:'t'+Math.random().toString(36).slice(2,8), name, pin}); render(); }
    catch(err){ e.textContent = err.message; }
  };
  box.append(left, right); return box;
}

/* маленькое подтверждение вместо confirm() */
function confirmish(msg){ return window.confirm(msg); }

/* =====================================================================
   ШАПКА РАСТВОРЯЕТСЯ ПРИ ПРОКРУТКЕ
   Та же механика, что в уроке (шаблон-курса.html): едем вниз — шапка
   уходит, и возвращается только у самого верха. От движения вверх
   посреди страницы она НЕ всплывает — иначе выворачивалась бы на
   содержимое от любого касания колеса. Класс вешается на body, вид —
   в theme.css по `body.hdr-away .topbar`. В кабинетах прячется всё:
   рельсы и кнопки возврата тут нет, а «Выйти» посреди страницы не нужна.
   ===================================================================== */
(function(){
  var last = 0;
  var GUARD = 140;   /* до этой прокрутки шапка всегда на месте */
  var JITTER = 5;    /* меньше этого — дрожание тачпада, не движение */
  function onScroll(){
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    if (y < GUARD){
      document.body.classList.remove('hdr-away');
    } else if (y > last + JITTER){
      document.body.classList.add('hdr-away');
    }
    last = y;
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll);
})();

/* =====================================================================
   СТАРТ
   ===================================================================== */
(async function(){
  document.getElementById('app').innerHTML = '<div class="login"><p class="muted">Загружаю…</p></div>';
  try { await Store.load(); }
  catch(e){
    document.getElementById('app').innerHTML =
      '<div class="login"><div class="panel"><h1 style="font-size:26px">Не получилось связаться с сервером</h1>' +
      '<p class="lede">' + esc(e.message) + '</p>' +
      '<p class="muted" style="font-size:13.5px">Проверь интернет и адрес в CONFIG.API_URL (см. НАСТРОЙКА.md).</p></div></div>';
    return;
  }
  // index.html?reset — вернуть демо-данные в исходный вид перед показом.
  // Раньше это была кнопка на серой плашке; плашку убрали, ход остался.
  if (!Store.live && /[?&]reset/.test(location.search)){
    try{ localStorage.removeItem('robo_school_db_v4'); localStorage.removeItem('robo_session'); }catch(e){}
    location.replace(location.pathname);
    return;
  }
  if (restore() && Store.live){
    // Человек уже входил на этом устройстве — забираем свежие списки. Если вход
    // устарел (или ученика/преподавателя убрали из списка) — на экран входа.
    try {
      await Store.refresh(S.role, S.studentCode);
      if (S.role === 'student' && !Store.db.students.some(s => s.id === S.studentId)) throw new Error('нет');
      if (S.role === 'teacher' && !Store.db.teachers.some(t => t.id === S.teacherId)) throw new Error('нет');
    } catch(e){ logout(); return; }
  }
  render();
})();
</script>
<script>
/* Защита от копирования — как в инструкции. Поля ввода не трогаем:
   преподавателю нужно копировать код ученика, ученику — вводить его. */
document.addEventListener('copy', function(e) {
  var t = e.target;
  if (t && t.closest && t.closest('input, textarea, [contenteditable="true"]')) return;
  e.preventDefault();
}, false);
document.addEventListener('contextmenu', function(e) {
  var t = e.target;
  if (t && t.closest && t.closest('input, textarea, [contenteditable="true"]')) return;
  e.preventDefault(); return false;
}, false);
</script>
